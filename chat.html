<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore-compat.js"></script>
    <title>Chat App</title>
</head>
<body>
    <h1>Chat</h1>
    <span id="myName"></span>
    <span id="roomID"></span>
    <span id="hostName"></span>

    <div id="chatContainer">
        <ul id="sidebar" class="chatChild">
        </ul>
        <div class="chatChild" id="chat">
            <ul id = "chatWindow">
                <li id = "newMessageNotif">&#9660;</li>
            </ul>
            <form id="chatForm">
                <input type="text" id="messageBox" placeholder="Enter message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </div>
    </div>
    
    <!-- <button id="copyCode">Copy Code</button> -->

    <script src = "scripts/setupChat.js"></script>
    <script src = "scripts/rtc.js"></script>
    <script src = "scripts/signalling.js"></script>
    <script src = "scripts/chatDom.js" ></script>
</body>
</html>
